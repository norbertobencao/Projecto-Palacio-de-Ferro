<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria | Palácio de Ferro</title>
    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prata&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&display=swap"
        rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tagesschrift&display=swap" rel="stylesheet">
</head>


<body>

    <header id="navbar">
        <script>
            fetch("./componentes/navbar.html")
                .then(response => response.text())
                .then(data => {
                    document.getElementById("navbar").innerHTML = data;
                });
        </script>
    </header>

    <section class="page-header background-img-styled mb-4"
        style="background-image: url(./public/images/cta-background.avif);">
        <div class="container justify-content-center align-items-center">
            <h1 data-translate="historia_titulo">Galeria de Imagens</h1>
        </div>
    </section>

    <section class="gallery-filters">
        <div class="container">
            <div class="filter-buttons">
                <button class="filter-btn" data-filter="festBalumuka">Fest. Balumuka</button>
                <button class="filter-btn" data-filter="trajetoria">Trajectória</button>
                <button class="filter-btn" data-filter="cineNoPf">Cine no PF</button>
                <button class="filter-btn" data-filter="arteDaPalavra">Arte da Palavra</button>
                <button class="filter-btn" data-filter="sextaFeiraDeTrova">Sexta-feira de trova</button>
                <button class="filter-btn" data-filter="festivais">Festivais</button>
                <button class="filter-btn" data-filter="diversos">Diversos</button>
            </div>
        </div>
    </section>

    <section class="gallery-main mb-4">
        <div class="container">
            <!-- Container vazio, o JS vai preencher -->
            <div class="gallery-grid"></div>
        </div>
    </section>

    <div class="modal">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="modal-image">
        <div class="modal-caption"></div>
        <a class="prev">&#10094;</a>
        <a class="next">&#10095;</a>
    </div>

    <div id="footer">
        <script>
            fetch("./componentes/footer.html")
                .then(response => response.text())
                .then(data => {
                    document.getElementById("footer").innerHTML = data;
                });
        </script>
    </div>

    <script src="js/script.js"></script>
    <script src="js/gallery.js"></script>
</body>

</html>
