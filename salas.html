<body>
  <header id="navbar">
    <script>
      fetch("./componentes/navbar.html")
        .then(response => response.text())
        .then(data => {
          document.getElementById("navbar").innerHTML = data;
        });
    </script>

      <div class="container justify-content-center align-items-center">
        <h1>Salas / Galerias</h1>
        <p class="fs-6 mt-3">
          Exploração visual dos espaços do Palácio de Ferro em uma galeria.
        </p>
      </div>
    </section>

        <div class="sala-header">
          <p class="sala-subtitle">Mandume</p>

        </div>
        <div class="scroll-gallery">
          <img src="public/images/Salas/Mandume/img1.jpeg" alt="" srcset="">

          <img src="public/images/Salas/Rainha Nginga/img1.jpeg" alt="" srcset="">
          <img src="public/images/Salas/Rainha Nginga/img2.jpeg" alt="" srcset="">
          <img src="public/images/Salas/Rainha Nginga/img3.jpeg" alt="" srcset="">
          <img src="public/images/Salas/Rainha Nginga/img4.jpeg" alt="" srcset="">

        <div class="scroll-gallery">
          <img src="public/images/Salas/Nhakatolo/img1.jpeg" alt="" srcset="">
